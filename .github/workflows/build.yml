name: Test, build, and upload LightKeeper

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build, test, and analyse
        run: |
          mvn --batch-mode --show-version --no-transfer-progress \
            -Perrorprone \
            clean verify \
            checkstyle:checkstyle \
            pmd:check \
            jacoco:report \
            -Dgoal=helpmojo

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          directory: lightkeeper-report-aggregate/target/site/jacoco-aggregate
          token: ${{ secrets.CODECOV_TOKEN }}
