name: Publish Javadocs to the hosted website

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Documentation artifact produced by the successful build in this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    concurrency:
      group: lightkeeper-javadoc-publish
      cancel-in-progress: false
      # Queue every release; the default single pending slot can discard publications.
      queue: max
    steps:
      - name: Checkout publishing tools and source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download documentation from this successful build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: incoming-documentation

      - name: Read latest published site inside the publication lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh_pages
          path: published-site

      - name: Verify existing branch-based Pages hosting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type == "legacy" and .source.branch == "gh_pages" and .source.path == "/"')" != true ]; then
            echo 'Expected GitHub Pages to serve gh_pages at /. Hosting settings will not be changed.' >&2
            exit 1
          fi

      - name: Assemble and validate complete site
        run: |
          python3 .github/scripts/javadoc.py assemble --published published-site \
            --artifact incoming-documentation --output assembled-site

      - name: Update only the Javadoc subtree
        working-directory: published-site
        run: |
          rsync --archive --delete ../assembled-site/javadoc/ ./javadoc/
          git add -- javadoc
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: publish verified versioned API documentation'
            git push origin HEAD:gh_pages
          fi

      - name: Request a build of the existing hosted branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST -H 'X-GitHub-Api-Version:2026-03-10' "repos/$GITHUB_REPOSITORY/pages/builds"
