name: Publish documentation

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Documentation artifact produced by the successful build in this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: lightkeeper-pages-publish
      cancel-in-progress: false
      # Queue every release; the default single pending slot can discard publications.
      queue: max
    steps:
      - name: Checkout publishing tools and source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download documentation from this successful build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: incoming-documentation

      - name: Read latest published site inside the publication lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh_pages
          path: published-site

      - name: Assemble and validate complete site
        run: |
          python3 .github/scripts/javadoc.py assemble --published published-site \
            --artifact incoming-documentation --output assembled-site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: assembled-site

      - name: Save durable site and Javadoc archive
        working-directory: published-site
        run: |
          rsync --archive --delete --exclude=.git ../assembled-site/ ./
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: publish verified guides and versioned API documentation'
            git push origin HEAD:gh_pages
          fi

      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
