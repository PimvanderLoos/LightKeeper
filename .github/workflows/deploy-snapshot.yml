name: Deploy snapshot to EldoNexus

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS"
  MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
  MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.MAVEN_GPG_KEY_FINGERPRINT }}
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

jobs:
  deploy-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 + GPG
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          server-id: eldonexus-snapshots
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Deploy snapshot
        run: |
          mvn --batch-mode --show-version --no-transfer-progress \
            -pl .,lightkeeper-runtime-core,lightkeeper-nms-parent,lightkeeper-agent-spigot,lightkeeper-framework-junit,lightkeeper-maven-plugin \
            -am \
            -Psign \
            -Dgpg.keyname=${MAVEN_GPG_KEY_FINGERPRINT} \
            -DskipTests \
            -DdeployAtEnd=true \
            deploy
