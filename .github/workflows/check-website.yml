name: Validate hosted website

on:
  pull_request:
    branches: [gh_pages]
  push:
    branches: [gh_pages]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: website
          persist-credentials: false

      - name: Checkout current framework and shared documentation checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: code
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate website links and JavaScript
        working-directory: code
        run: |
          python3 .github/scripts/site_checks.py --site ../website --source-only
          node --check ../website/assets/main.js

      - name: Build the current API and Maven descriptors without server tests
        working-directory: code
        run: |
          mvn --batch-mode --no-transfer-progress -Pdefault \
            -pl lightkeeper-framework-junit,lightkeeper-maven-plugin -am \
            -DskipTests -Dmaven.javadoc.skip=true install
          mvn --batch-mode --no-transfer-progress -pl lightkeeper-framework-junit \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:build-classpath \
            -Dmdep.outputFile=target/site-classpath.txt -DincludeScope=test

      - name: Compile actual website examples and validate Maven options
        working-directory: code
        run: |
          python3 .github/scripts/site_checks.py --site ../website --source-only \
            --classpath-file lightkeeper-framework-junit/target/site-classpath.txt \
            --plugin-descriptor lightkeeper-maven-plugin/target/classes/META-INF/maven/plugin.xml
