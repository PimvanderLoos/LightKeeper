name: Import historical API documentation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Historical tag with an explicitly recorded SNAPSHOT source version
        required: true
        type: choice
        options:
          - v1.2.0
          - v1.1.0
          - v1.0.0

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-name: historical-documentation-${{ github.run_attempt }}
    steps:
      - name: Checkout trusted publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact historical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: historical-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate historical identity and add build-only docs profile
        env:
          HISTORICAL_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/legacy_docs.py --source historical-source --tag "$HISTORICAL_TAG"

      - name: Prepare historical provenance
        id: docs
        working-directory: historical-source
        env:
          HISTORICAL_TAG: ${{ inputs.tag }}
        run: python3 ../.github/scripts/javadoc.py prepare --legacy-tag "$HISTORICAL_TAG" --output "$RUNNER_TEMP/historical-build.json"

      - name: Verify historical source and build its API documentation
        working-directory: historical-source
        env:
          JAVADOC_TOP: ${{ steps.docs.outputs.top }}
        run: |
          mvn --batch-mode --no-transfer-progress -Perrorprone \
            clean verify install -Dmaven.javadoc.skip=true checkstyle:checkstyle pmd:check jacoco:report
          mvn --batch-mode --no-transfer-progress -Pdefault,docs \
            "-Dtop=$JAVADOC_TOP" site:site
          python3 ../.github/scripts/javadoc.py seal --docs target/site/apidocs \
            --info "$RUNNER_TEMP/historical-build.json" --artifact "$RUNNER_TEMP/historical-documentation"

      - name: Upload historical API documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-documentation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical-documentation
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-site.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
